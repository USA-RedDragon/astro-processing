# Sample configuration
# Logging level for the application. One of debug, info, warn, or error
log-level: "info"
# HTTP server configuration
http:
  # Address to listen on
  bind: "[::]"
  # Port to listen on
  port: 8080
  # Trusted proxy IPs whose X-Forwarded-* headers are honored
  # trusted-proxies: []
  # CORS configuration
  cors:
    # Enable CORS
    enabled: false
    # List of allowed origins for CORS
    allowed-origins: ["*"]
    # List of allowed HTTP methods for CORS
    allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    # List of allowed HTTP headers for CORS
    allowed-headers: ["Origin", "Content-Type", "Accept", "Authorization"]
    # Allow credentials for CORS
    allow-credentials: false
# Prometheus metrics server configuration
metrics:
  # Enable metrics server
  enabled: false
  # Address to listen on
  bind: "127.0.0.1"
  # Port to listen on
  port: 9000
# Go pprof profiling server configuration, for debugging and performance analysis
pprof:
  # Enable pprof server
  enabled: false
  # Address to listen on
  bind: "127.0.0.1"
  # Port to listen on
  port: 9999
# Storage configuration
storage:
  # Storage type. One of mysql, postgres, sqlite
  type: "sqlite"
  # Data source name for the storage, for example file:database.db?_pragma=foreign_keys(1)&journal_mode=WAL (sqlite), host=localhost user=username dbname=database password=password sslmode=disable (postgres) or username:password@tcp(localhost:3306)/database?charset=utf8&parseTime=True (mysql)
  dsn: ":memory:?_pragma=foreign_keys(1)"
# pixinsight-worker connection
worker:
  # Base URL of pixinsight-worker, for calibration coverage. Empty disables it
  # url: ""
